<!doctype html>
<html><head><meta charset="utf-8"><title>Options harness</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style></head>
<body>
<iframe id="f"></iframe>
<script>
// Loads options.html with a fake chrome.* so the settings page can be viewed outside the extension.
const SHIM = `<script>
  window.chrome = {
    runtime: {
      sendMessage: async msg => {
        if (msg.type === 'snapask:getSettings') return { provider: 'anthropic', keys: { anthropic: '', openai: '', gemini: '' },
          models: { anthropic: 'claude-opus-5', openai: 'gpt-5', gemini: 'gemini-2.5-flash' }, depth: 'balanced', language: 'auto', onboarded: false, autoPause: true, defaultMode: 'auto', siteModes: { 'youtube.com': 'summarize', 'github.com': 'code' } };
        if (msg.type === 'snapask:test') { await new Promise(r => setTimeout(r, 600)); return msg.apiKey.startsWith('sk-ant-') ? { ok: true } : { ok: false, error: 'Your API key was rejected. Check it in SnapAsk settings.' }; }
      },
      getManifest: () => ({ version: '1.0.0' }),
    },
    storage: { local: { set: async v => console.log('[harness] saved', JSON.stringify(v)) } },
    commands: { getAll: async () => [{ name: 'capture', shortcut: 'Alt+Shift+A' }] },
    tabs: { create: o => console.log('[harness] open', o.url) },
  };
<\/script>`;
fetch('../options.html?welcome=1').then(r => r.text()).then(html => {
  document.getElementById('f').srcdoc = html.replace('<head>', '<head><base href="' + new URL('../', location.href) + '">' + SHIM);
});
</script>
</body></html>
